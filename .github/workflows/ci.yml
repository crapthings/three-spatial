name: Skill checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check skill metadata and portable references
        run: node scripts/check-skill.js
      - name: Install locked runtime
        working-directory: .agents/skills/three-spatial/scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify offline tool behavior
        run: node --test test/runtime.test.js
